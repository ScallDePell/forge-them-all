# Publie une release GitHub quand un tag vX.Y.Z est poussé : vérifie que le tag correspond à la version de
# module.json, construit forge-them-all.zip (dossier forge-them-all/ prêt pour Data/modules/) et l'attache
# avec module.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la version
        run: |
          version=$(jq -r .version module.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à module.json ($version)"
            exit 1
          fi

      - name: Construire l'archive
        run: |
          mkdir -p dist/forge-them-all
          cp -r module.json README.md lang module styles templates dist/forge-them-all/
          (cd dist && zip -r forge-them-all.zip forge-them-all)

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/forge-them-all.zip module.json \
            --title "Forge Them'All $GITHUB_REF_NAME" --generate-notes --prerelease
