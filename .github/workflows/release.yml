# Publie une release GitHub à chaque nouvelle version : quand module.json change sur main (ou à la demande),
# si la release vX.Y.Z de sa version n'existe pas encore, construit forge-them-all.zip (fichiers du module à la
# racine, comme l'attend l'installation par manifest de Foundry), crée le tag et la release (dernière version, visible
# dans la colonne du dépôt) et y attache l'archive et module.json.
name: Release

on:
  push:
    branches: [main]
    paths: [module.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version module.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La release $tag existe déjà : on s'assure seulement qu'elle est publiée comme dernière version."
            gh release edit "$tag" --prerelease=false --latest
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire l'archive
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Le lien de téléchargement suit toujours la version publiée, même si module.json n'a pas été mis à jour.
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/forge-them-all.zip"
          jq --arg download "$download" '.download = $download' module.json > module.release.json
          mkdir -p dist/pkg
          cp -r README.md lang module styles templates dist/pkg/
          cp module.release.json dist/pkg/module.json
          cp module.release.json dist/module.json
          (cd dist/pkg && zip -r ../forge-them-all.zip .)

      - name: Créer la release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/forge-them-all.zip dist/module.json --target "$GITHUB_SHA" \
            --title "Forge Them'All $TAG" --generate-notes --latest
